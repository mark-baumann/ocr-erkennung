name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Tests
        run: python -m pytest tests/ -q

      - name: Streamlit-GUI startet
        run: |
          streamlit run app/app.py --server.headless true --server.port 8513 &
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8513/_stcore/health && exit 0
            sleep 2
          done
          echo "GUI wurde nicht gesund" >&2
          exit 1
