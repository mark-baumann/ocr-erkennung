[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deepseek-ocr-studio"
version = "1.0.0"
description = "DeepSeek-OCR mit Streamlit-GUI und headless Pipeline für Jupyter Notebook und Batch-Verarbeitung."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pillow>=10.0",
    "numpy>=1.24",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
app = ["streamlit>=1.40", "markdown>=3.5"]
gpu = ["transformers==4.46.3", "tokenizers>=0.20.3,<0.21", "einops", "easydict", "addict"]
dev = ["pytest>=8.0", "streamlit>=1.40", "markdown>=3.5"]

[project.scripts]
dsocr = "dsocr.cli:main"

[project.urls]
Upstream = "https://github.com/deepseek-ai/DeepSeek-OCR"

[tool.setuptools.packages.find]
include = ["dsocr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:dsocr.*"]

[tool.ruff]
line-length = 120
target-version = "py310"
